[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cargoclarity"
version = "0.3.0"
description = "Explainable SI/BL document verification with deterministic rules and optional AI assistance"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1,<4",
  "pypdf>=5,<6",
  "python-docx>=1.1,<2",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
ai = ["openai>=1.60,<2"]

[project.scripts]
cargoclarity = "cargoclarity.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
